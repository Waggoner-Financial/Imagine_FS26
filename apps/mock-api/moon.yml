$schema: 'https://moonrepo.dev/schemas/project.json'

# GraphQL server for the Portfolio Dashboard, serving schema.graphql from the
# sample data in @imagine/mock-data. Inherits test/typecheck from the shared
# bun-common tasks. Nothing imports this app, so it is not listed in the root
# project's dependsOn.
language: 'typescript'
layer: 'application'

tasks:
  # Bundles the server, the schema and all dependencies into one file for
  # deployment. Named `build` so CI proves the deploy artifact still builds.
  build:
    command: 'bun build src/main.ts --target=bun --outfile=dist/server.js'
    deps:
      - '^:build'
    inputs:
      - 'src/**/*'
      - 'schema.graphql'
    outputs:
      - 'dist'

  # Regenerates src/generated from schema.graphql. Commit the output.
  codegen:
    command: 'graphql-codegen --config codegen.ts'
    options:
      cache: false
      runInCI: 'always'

  # Fails when schema.graphql changed but src/generated was not regenerated.
  codegen-check:
    command: 'graphql-codegen --config codegen.ts --check'
    inputs:
      - 'schema.graphql'
      - 'codegen.ts'
      - 'src/generated/**/*'
    options:
      runInCI: 'always'

  # Graph-connected local servers stay CI-skipped. In CI-marked shells
  # (agent harnesses): `moonx mock-api:dev --ignore-ci-checks`.
  #
  # Both listen on 4000 plus the worktree's port offset (0 in the main clone),
  # so servers in parallel worktrees never collide; see scripts/README.md.
  # run-dev.sh first stops any stale server still holding that port.
  dev:
    script:
      'export PORT=$(( ${WORKTREE_PORT_OFFSET:-0} + 4000 )) && bash
      ../../scripts/run-dev.sh "$PORT" -- bun --watch src/main.ts'
    deps:
      - '^:build'
    options:
      cache: false
      envFile: '/.env.worktree'
      persistent: true
      runInCI: 'skip'

  start:
    script:
      'export PORT=$(( ${WORKTREE_PORT_OFFSET:-0} + 4000 )) && bash
      ../../scripts/run-dev.sh "$PORT" -- bun src/main.ts'
    deps:
      - '^:build'
    options:
      cache: false
      envFile: '/.env.worktree'
      persistent: true
      runInCI: 'skip'
